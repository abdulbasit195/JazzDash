<!DOCTYPE html>
<!--
  =============================================================================
  JAZZ DASH — home / login page for the JazzDash repo
  =============================================================================
  The front door for every dashboard in this repo (Compliance Dash, Audit
  Dash, ...). Dashboard pages have no login and no file pickers of their
  own — everything starts here.

    1. "Open folder locally" / "Open file locally" (no login needed)
       -> the picker opens straight away (asking for read+write access in
          the same click, so a later save doesn't need a second prompt)
       -> this page reads just the header rows of each picked Excel file
          and scores them against each dashboard's fingerprint
          (DASHBOARDS[].detect below)
       -> a pick can contain files for more than one dashboard at once
          (e.g. a mixed folder): each file is classified on its own, then
          grouped by dashboard. One group -> that dashboard opens
          directly. More than one group, or files we can't place with
          confidence -> you're asked which dashboard/group to open.
       -> the picked handle(s) are also saved to a shared IndexedDB
          database ("JazzDashShared") under the dashboard's id, so a
          dashboard page can pick the same file/folder back up without
          asking again, IF that dashboard has been given the small
          receiver snippet for it. As shipped, none of the dashboard
          pages read this yet, so today you'll just be asked to pick the
          file again on the dashboard — see "TO ADD A NEW DASHBOARD".

    2. "Login to Jazz Dash" -> Google sign-in. While the OAuth consent
       screen is in "Testing" status, only emails on the Test Users list
       can sign in (a Google-side gate, nothing here enforces it). After
       sign-in, only the dashboards whose Drive folder the person can see
       are shown. Clicking one of those buttons downloads every .xlsx
       file directly out of that Drive folder (Drive API, read-only —
       this page never writes anything back to Drive) and hands them to
       the dashboard the same way a local pick does (the shared
       IndexedDB "JazzDashShared" hand-off — see point 1), so the
       dashboard opens with the real Drive data already loaded, no local
       picker involved. Saves inside the dashboard still only save to an
       in-memory copy / download, since round-tripping edits back up to
       Drive isn't wired up (yet). The sign-in token is cached in
       sessionStorage for this tab only, so using the browser Back button
       to return here after opening a dashboard skips the sign-in screen;
       it's cleared on sign-out or tab close.

  TO ADD A NEW DASHBOARD: add one entry to DASHBOARDS below — its page,
  its Drive folder name (for the login flow), and its `detect`
  fingerprint (for the local-open flow). To make that dashboard receive a
  locally-picked file/folder directly instead of asking again, add a
  small "JAZZ DASH HANDOFF (receiver)" snippet to its page that reads
  IndexedDB "JazzDashShared" / store "sessions" / key = the dashboard's
  `id` (record shape is written by handOff() below) — until that
  snippet exists on a given dashboard page, that dashboard just gets a
  normal navigation and its own picker runs again there. Nothing else in
  this file needs to change either way.

  TO ADD/REMOVE A TEST USER: Google Cloud Console -> APIs & Services ->
  OAuth consent screen -> Test users. Takes effect immediately, no
  redeploy.

  The GitHub Pages URL must be an "Authorized JavaScript origin" on the
  OAuth Client ID (Google Cloud Console -> APIs & Services ->
  Credentials).
  =============================================================================
-->
<html lang="en">

<!-- SheetJS — only used to peek at header rows so the right dashboard can be

<style>

    radial-gradient(circle at 50% 20%, rgba(226,67,74,.08), transparent 60%),

<body>

<div class="frame">
  <div class="brand"><span class="jazz">Jazz</span> <span class="dash">Dash</span></div>
  <div class="tagline">Mobilink Bank · Dashboards</div>

  <!-- ===================== HOME PANEL (always the starting point) ===================== -->
  <div id="homePanel" class="btn-row">
    <button type="button" class="btn btn-ghost" id="openFolderBtn">Open folder locally</button>
    <button type="button" class="btn btn-ghost" id="openFileBtn">Open file locally</button>
    <div class="divider">OR</div>
    <button type="button" class="btn btn-primary" id="loginBtn">Login to Jazz Dash</button>
  </div>

  <!-- ===================== "WHICH DASHBOARD" PANEL (only when detection isn't sure) ===================== -->
  <div id="pickerPanel" class="sub-panel" style="display:none;">
    <div class="back-link" id="pickerBack">&larr; Back</div>
    <div class="prompt" id="pickerPrompt"></div>
    <div class="btn-row" id="pickerButtons"></div>
  </div>

  <!-- ===================== SIGNED-IN PANEL (shows only shared dashboards) ===================== -->
  <div id="dashPanel" class="sub-panel" style="display:none;">
    <div class="user-chip" id="userChip"></div>
    <div class="btn-row" id="dashButtons"></div>
    <div class="empty-note" id="dashEmptyNote" style="display:none;">
      No dashboards have been shared with your account yet — ask an admin to share the relevant Drive folder with you.
    </div>
  </div>

  <div class="status-line" id="statusLine"></div>

  <!-- Fallbacks for browsers without folder/file access (Firefox, Safari):
       files open read-only there, and saves download an updated copy. -->
  <input type="file" id="folderInputFallback" webkitdirectory multiple style="display:none;">
  <input type="file" id="fileInputFallback" accept=".xlsx" multiple style="display:none;">
</div>

<script>
// =============================================================================
// CONFIG — the only part you should need to touch to add a new dashboard.
// =============================================================================
const GOOGLE_CLIENT_ID = "266151179037-31hb7cd1rug94o423ab4kbonrqcfo060.apps.googleusercontent.com";

// One entry per dashboard.
//   id              — must match the id used by that dashboard's own
//                     "JAZZ DASH HANDOFF (receiver)" snippet, once it has one
//   driveFolderName — exact name of the Drive folder that gates the login flow
//   detect          — the fingerprint used to recognise its Excel files:
//       headers: words/phrases to look for in the first rows of every tab,
//                with a weight (something that only ever appears in this
//                dashboard's files gets a high weight)
//       sheets:  tab names typical of this dashboard's files
//     A file goes to the dashboard with the highest score, as long as it
//     scores at least MIN_DETECT_SCORE and beats every other dashboard.
const DASHBOARDS = [
  {
    id: "compliance", label: "Compliance Dash", url: "compliance_dashboard.html", driveFolderName: "Compliance",
    detect: {
      headers: {
        "brief": 4, "relevant department": 1, "department": 1,
        "compliance status": 2, "ia validation": 1, "internal audit validation": 1,
      },
      sheets: ["so", "sso", "annexure", "appendix"],
    },
  },
  {
    id: "audit", label: "Audit Dash", url: "audit_dashboard.html", driveFolderName: "Internal Audit",
    detect: {
      headers: {
        "audit period": 3, "report name": 2, "total observation": 3, "open observation": 2,
        "close observation": 2, "observation severity": 2, "dependent team": 1, "team name": 1,
      },
      sheets: [],
    },
  },
  {
    // Risk Management Dash reads several DIFFERENT file shapes (Issues,
    // KRIs, Risk Register, Incidents, ...) out of one Drive folder — only
    // "Issues" files are taught to it so far (see detectIssuesLayout() in
    // its own app.js). Add that new kind's distinctive headers below, at
    // the same time it's added to that dashboard's own detector list, so
    // this home page keeps recognising every file kind that dashboard can
    // actually read.
    id: "risk-management", label: "Risk Management Dash", url: "risk_management_dashboard.html", driveFolderName: "Risk Management",
    detect: {
      headers: {
        // Issues files:
        "issue title": 4, "issue description": 2, "discovery date": 2,
        "target completion date": 3, "issue owners": 2,
      },
      sheets: [],
    },
  },
];
const MIN_DETECT_SCORE = 3;

// Where the Google sign-in token is cached for this tab, so coming back to
// this page (e.g. the browser Back button from a dashboard) can skip the
// sign-in screen. See initGoogle below for what this token can do.
const JAZZDASH_TOKEN_KEY = "jazzdash_google_token";
// How many .xlsx files to pull out of a single Drive folder in one go.
const MAX_DRIVE_FILES = 25;

// =============================================================================

const homePanel = document.getElementById("homePanel");
const pickerPanel = document.getElementById("pickerPanel");
const dashPanel = document.getElementById("dashPanel");
const statusLine = document.getElementById("statusLine");

function showPanel(panel) {
  [homePanel, pickerPanel, dashPanel].forEach((p) => { p.style.display = p === panel ? "" : "none"; });
}
function setStatus(msg, isError) {
  statusLine.textContent = msg || "";
  statusLine.classList.toggle("err", !!isError);
}
function setHomeBusy(busy) {
  homePanel.querySelectorAll("button").forEach((b) => { b.disabled = busy; });
}
function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function isExcel(name) { return /\.xlsx$/i.test(name) && !name.startsWith("~$"); } // ~$ = Excel's own lock files

// =============================================================================
// OPEN LOCALLY — pick, detect, hand over
// =============================================================================
// A "picked" object is: { kind: "folder"|"handles"|"blobs", label,
//   dirHandle?, entries: [{ name, getFile(), handle?, file? }] }

document.getElementById("openFolderBtn").addEventListener("click", async () => {
  setStatus("");
  if (typeof window.showDirectoryPicker !== "function") {
    document.getElementById("folderInputFallback").click();
    return;
  }
  let dirHandle;
  try {
    // readwrite up front: one "allow editing" prompt now, so saves in the
    // dashboard go straight through without asking again.
    dirHandle = await window.showDirectoryPicker({ id: "jazzdash", mode: "readwrite" });
  } catch (err) {
    if (err.name !== "AbortError") setStatus("Couldn't open that folder: " + err.message, true);
    return;
  }
  const entries = [];
  for await (const [name, h] of dirHandle.entries()) {
    if (h.kind === "file" && isExcel(name)) entries.push({ name, handle: h, getFile: () => h.getFile() });
  }
  await detectAndRoute({ kind: "folder", label: dirHandle.name, dirHandle, entries });
});

document.getElementById("openFileBtn").addEventListener("click", async () => {
  setStatus("");
  if (typeof window.showOpenFilePicker !== "function") {
    document.getElementById("fileInputFallback").click();
    return;
  }
  let handles;
  try {
    handles = await window.showOpenFilePicker({
      id: "jazzdash",
      multiple: true,
      types: [{ description: "Excel workbook", accept: { "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx"] } }],
    });
  } catch (err) {
    if (err.name !== "AbortError") setStatus("Couldn't open that file: " + err.message, true);
    return;
  }
  // showOpenFilePicker (unlike showDirectoryPicker) has no "mode" option, so
  // write access has to be requested per handle, right away in this same
  // click, so a later save in the dashboard doesn't hit a second prompt.
  for (const h of handles) {
    try { await h.requestPermission({ mode: "readwrite" }); } catch (err) { /* best-effort; dashboard falls back to read-only / download-a-copy */ }
  }
  const entries = handles.filter((h) => isExcel(h.name)).map((h) => ({ name: h.name, handle: h, getFile: () => h.getFile() }));
  await detectAndRoute({ kind: "handles", label: entries.length === 1 ? entries[0].name : `${entries.length} files`, entries });
});

// Browsers without the File System Access API: plain File objects.
function pickedFromFileList(fileList, isFolder) {
  const files = Array.from(fileList || []).filter((f) => isExcel(f.name) && (!isFolder || !/\//.test(stripTopFolder(f))));
  const topFolder = isFolder && fileList.length ? (fileList[0].webkitRelativePath || "").split("/")[0] : "";
  return {
    kind: "blobs",
    label: isFolder ? (topFolder || "folder") : (files.length === 1 ? files[0].name : `${files.length} files`),
    entries: files.map((f) => ({ name: f.name, file: f, getFile: async () => f })),
  };
}
function stripTopFolder(f) { return (f.webkitRelativePath || f.name).split("/").slice(1).join("/"); } // only the folder's own files, not subfolders
document.getElementById("folderInputFallback").addEventListener("change", (e) => {
  if (e.target.files.length) detectAndRoute(pickedFromFileList(e.target.files, true));
  e.target.value = "";
});
document.getElementById("fileInputFallback").addEventListener("change", (e) => {
  if (e.target.files.length) detectAndRoute(pickedFromFileList(e.target.files, false));
  e.target.value = "";
});

// ---------------------------------------------------------------- detection --
// Reads only the first few rows of every tab (fast even for big files) and
// scores the file against each dashboard's fingerprint.
async function readFingerprint(entry) {
  const buf = await (await entry.getFile()).arrayBuffer();
  const wb = XLSX.read(buf, { type: "array", sheetRows: 15 });
  const headerText = [];
  wb.SheetNames.forEach((sn) => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: "" });
    rows.forEach((r) => r.forEach((c) => { if (c !== "" && c != null) headerText.push(String(c).toLowerCase().replace(/\s+/g, " ").trim()); }));
  });
  return { sheetNames: wb.SheetNames.map((s) => s.toLowerCase().trim()), headerText };
}
function scoreAgainst(fp, dash) {
  let score = 0;
  Object.entries(dash.detect.headers || {}).forEach(([word, weight]) => {
    if (fp.headerText.some((h) => h.includes(word))) score += weight;
  });
  let sheetHits = 0;
  (dash.detect.sheets || []).forEach((s) => {
    if (fp.sheetNames.some((n) => n === s || n.startsWith(s + " ") || n.startsWith(s + "-"))) sheetHits++;
  });
  return score + Math.min(sheetHits, 2);
}
function classify(fp) {
  const scored = DASHBOARDS.map((d) => ({ d, s: scoreAgainst(fp, d) })).sort((a, b) => b.s - a.s);
  const best = scored[0], second = scored[1];
  if (!best || best.s < MIN_DETECT_SCORE) return null;
  if (second && second.s === best.s) return null; // a tie means we genuinely can't tell
  return best.d.id;
}

async function detectAndRoute(picked) {
  if (!picked.entries.length) {
    setStatus(picked.kind === "folder" ? `No Excel (.xlsx) files in "${picked.label}".` : "No Excel (.xlsx) file was picked.", true);
    return;
  }
  setHomeBusy(true);
  setStatus(`Reading ${picked.entries.length} file(s) to find the right dashboard…`);

  const groups = {};   // dashboard id -> [file names]
  const unknown = [];
  const detectionAvailable = typeof XLSX !== "undefined";
  for (const entry of picked.entries) {
    let id = null;
    if (detectionAvailable) {
      try { id = classify(await readFingerprint(entry)); } catch (err) { console.warn(`Couldn't read "${entry.name}":`, err); }
    }
    if (id) (groups[id] = groups[id] || []).push(entry.name); else unknown.push(entry.name);
  }
  setHomeBusy(false);

  const ids = Object.keys(groups);
  if (ids.length === 1) {
    // One clear answer: go straight there. Unrecognised files in the same
    // folder/pick ride along (they'll just show as having nothing to read).
    const dash = DASHBOARDS.find((d) => d.id === ids[0]);
    await handOff(picked, dash, null);
    return;
  }
  showDashboardChooser(picked, groups, unknown, detectionAvailable);
}

function showDashboardChooser(picked, groups, unknown, detectionAvailable) {
  const ids = Object.keys(groups);
  const prompt = document.getElementById("pickerPrompt");
  const btnWrap = document.getElementById("pickerButtons");
  let options;
  if (ids.length > 1) {
    prompt.innerHTML = `These files belong to more than one dashboard. Which set do you want to open?` +
      (unknown.length ? `<span class="muted">${unknown.length} file(s) weren't recognised and are left out.</span>` : "");
    options = ids.map((id) => {
      const d = DASHBOARDS.find((x) => x.id === id);
      return { dash: d, names: groups[id], sub: `${groups[id].length} file(s): ${groups[id].slice(0, 2).join(", ")}${groups[id].length > 2 ? "…" : ""}`, suggested: true };
    });
  } else {
    prompt.innerHTML = detectionAvailable
      ? `Couldn't tell which dashboard ${picked.entries.length === 1 ? "this file is" : "these files are"} for. Open in:`
      : `Open ${picked.entries.length === 1 ? "this file" : "these files"} in:`;
    options = DASHBOARDS.map((d) => ({ dash: d, names: null, sub: "", suggested: false }));
  }
  btnWrap.innerHTML = options.map((o, i) => {
    const suggested = o.suggested && i === 0;
    return `<button type="button" class="btn btn-ghost ${suggested ? "btn-suggested" : ""}" data-idx="${i}">${escapeHtml(o.dash.label)}${suggested ? '<span class="tag">BEST MATCH</span>' : ""}${o.sub ? `<span class="sub">${escapeHtml(o.sub)}</span>` : ""}</button>`;
  }).join("");
  btnWrap.querySelectorAll("[data-idx]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const o = options[Number(btn.getAttribute("data-idx"))];
      handOff(picked, o.dash, o.names);
    });
  });
  setStatus("");
  showPanel(pickerPanel);
}

// ------------------------------------------------------------------ handoff --
// Stores what was picked under the dashboard's id in a shared IndexedDB
// database, then opens the dashboard page. A dashboard picks this up only
// if it has a matching "JAZZ DASH HANDOFF (receiver)" snippet (see the
// header comment) — until then this is just a forward-compatible record and
// the dashboard's own picker runs again on arrival.
// `onlyNames` limits which files go (used when a pick spanned dashboards).
const JAZZ_DB_NAME = "JazzDashShared";
const JAZZ_STORE = "sessions";
function jazzIdbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(JAZZ_DB_NAME, 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(JAZZ_STORE)) req.result.createObjectStore(JAZZ_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function jazzPutSession(id, record) {
  const db = await jazzIdbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(JAZZ_STORE, "readwrite");
    tx.objectStore(JAZZ_STORE).put(record, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function handOff(picked, dash, onlyNames) {
  const keep = onlyNames ? new Set(onlyNames) : null;
  const entries = picked.entries.filter((e) => !keep || keep.has(e.name));
  const record = { kind: picked.kind, label: picked.label, savedAt: Date.now() };
  if (picked.kind === "folder") {
    record.dirHandle = picked.dirHandle;
    record.names = onlyNames || null; // null = every Excel file in the folder, including ones added later
  } else if (picked.kind === "handles") {
    record.handles = entries.map((e) => e.handle);
  } else {
    record.files = entries.map((e) => e.file);
  }
  try {
    await jazzPutSession(dash.id, record);
  } catch (err) {
    // Non-fatal — the dashboard's own picker still works, it just means the
    // hand-off record wasn't saved for a future receiver snippet to use.
    console.warn("Couldn't save the hand-off record:", err);
  }
  setStatus(`Opening in ${dash.label}…`);
  window.location.href = dash.url;
}

document.getElementById("pickerBack").addEventListener("click", () => { showPanel(homePanel); setStatus(""); });

// =============================================================================
// GOOGLE SIGN-IN
// =============================================================================
let tokenClient = null;
let currentUser = null;   // {name, email, picture}
let accessToken = null;

function initGoogle() {
  if (typeof google === "undefined" || !google.accounts) {
    setStatus("Couldn't load Google Sign-In — check your connection and reload.", true);
    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    // Full "drive" scope (not drive.readonly, and not the narrower
    // drive.file, which only sees files THIS app created): this page checks
    // folder VISIBILITY by name and lists each folder's .xlsx files, but the
    // actual reading AND WRITING of file content now happens entirely on
    // the dashboard side (see each dashboard's createDriveFileHandle). The
    // dashboard needs to be able to save edits straight back to the real
    // Drive file, which requires full read/write access, not just
    // read-only — this is the one real permissions change in the
    // round-tripping design: every signed-in user will be asked to grant
    // read/write Drive access instead of read-only.
    scope: "https://www.googleapis.com/auth/drive " +
           "https://www.googleapis.com/auth/userinfo.email " +
           "https://www.googleapis.com/auth/userinfo.profile",
    callback: async (resp) => {
      if (resp.error) {
        setStatus("Sign-in was cancelled or blocked.", true);
        return;
      }
      accessToken = resp.access_token;
      saveCachedToken(resp);
      await afterSignIn();
    },
  });
}
window.addEventListener("load", initGoogle);

function saveCachedToken(resp) {
  try {
    sessionStorage.setItem(JAZZDASH_TOKEN_KEY, JSON.stringify({
      token: resp.access_token,
      expiresAt: Date.now() + (Number(resp.expires_in) || 3600) * 1000,
    }));
  } catch (e) { /* sessionStorage blocked — sign-in will just be asked for again */ }
}
function readCachedToken() {
  try {
    const saved = JSON.parse(sessionStorage.getItem(JAZZDASH_TOKEN_KEY) || "null");
    if (!saved || !saved.token || Date.now() > saved.expiresAt - 60 * 1000) return null;
    return saved.token;
  } catch (e) { return null; }
}

document.getElementById("loginBtn").addEventListener("click", () => {
  if (!tokenClient) { setStatus("Google Sign-In is still loading — try again in a moment.", true); return; }
  setStatus("Opening Google sign-in…");
  tokenClient.requestAccessToken({ prompt: "" });
});

// Coming back to this page in the same tab (e.g. the browser Back button
// from a dashboard) while the cached token is still valid: skip straight
// past the sign-in screen instead of asking again.
window.addEventListener("DOMContentLoaded", () => {
  const token = readCachedToken();
  if (token) {
    accessToken = token;
    afterSignIn();
  }
});

async function afterSignIn() {
  setStatus("Checking your account…");
  try {
    const userResp = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
      headers: { Authorization: `Bearer ${accessToken}` },
    });
    if (!userResp.ok) throw new Error("Could not read your Google profile.");
    currentUser = await userResp.json();
  } catch (err) {
    try { sessionStorage.removeItem(JAZZDASH_TOKEN_KEY); } catch (e) {}
    accessToken = null;
    setStatus(err.message || "Sign-in failed.", true);
    return;
  }

  renderUserChip();
  setStatus("Checking which dashboards are shared with you…");

  // dashboard id -> the Drive folder id that gated it, so the click handler
  // below knows exactly which folder to pull files from.
  const accessible = [];
  const folderIdFor = {};
  for (const d of DASHBOARDS) {
    try {
      const folder = await findDriveFolder(d.driveFolderName);
      if (folder) { accessible.push(d); folderIdFor[d.id] = folder.id; }
    } catch (err) {
      console.warn(`Could not check Drive access for "${d.driveFolderName}":`, err);
    }
  }

  const dashButtons = document.getElementById("dashButtons");
  const emptyNote = document.getElementById("dashEmptyNote");
  if (accessible.length) {
    dashButtons.innerHTML = accessible.map(
      (d) => `<button type="button" class="btn btn-primary" data-id="${d.id}" style="box-shadow:none;">${escapeHtml(d.label)}</button>`
    ).join("");
    dashButtons.querySelectorAll("[data-id]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const d = DASHBOARDS.find((x) => x.id === btn.getAttribute("data-id"));
        openDashboardFromDrive(d, folderIdFor[d.id]);
      });
    });
    emptyNote.style.display = "none";
  } else {
    dashButtons.innerHTML = "";
    emptyNote.style.display = "";
  }

  setStatus("");
  showPanel(dashPanel);
}

// The signed-in user's own Drive folder with this exact name, or null —
// Drive only returns folders they own or have been shared with them.
async function findDriveFolder(folderName) {
  const q = `mimeType='application/vnd.google-apps.folder' and name='${folderName.replace(/'/g, "\\'")}' and trashed=false`;
  const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&pageSize=1&fields=files(id,name)`;
  const resp = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
  if (!resp.ok) throw new Error(`Drive check failed (${resp.status})`);
  const data = await resp.json();
  return (Array.isArray(data.files) && data.files[0]) || null;
}

// ------------------------------------------------------- drive hand-off --
// IMPORTANT — this page does NOT download any Drive file's actual content.
// It only lists each folder's .xlsx files' lightweight metadata (id, name,
// modifiedTime) and hands those REFERENCES to the dashboard. The dashboard
// itself downloads bytes lazily — only when a file is actually opened — and
// caches/round-trips them from there (see each dashboard's
// createDriveFileHandle / driveApiFetch / JazzDashDriveCache code). This
// keeps this page fast no matter how big the files are, and means a save
// made in the dashboard writes straight back to the real file in Drive.
async function listDriveExcelFiles(folderId) {
  const q = `'${folderId}' in parents and mimeType='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' and trashed=false`;
  const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&pageSize=${MAX_DRIVE_FILES}&fields=files(id,name,modifiedTime)`;
  const resp = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
  if (!resp.ok) throw new Error(`Couldn't list Drive files (${resp.status})`);
  const data = await resp.json();
  return (data.files || []).filter((f) => isExcel(f.name));
}

// Looks up a Drive folder's .xlsx files (metadata only — see the note
// above) and hands those references to the chosen dashboard as a "drive"
// kind record in JazzDashShared, then navigates to it. The dashboard reads
// this record on load and does all the actual file reading/writing itself.
async function openDashboardFromDrive(dash, folderId) {
  if (!folderId) { setStatus("Couldn't find that Drive folder.", true); return; }
  setStatus(`Reading "${dash.driveFolderName}" from Drive…`);
  let driveFiles;
  try {
    driveFiles = await listDriveExcelFiles(folderId);
  } catch (err) {
    setStatus("Couldn't list files in that Drive folder: " + err.message, true);
    return;
  }
  if (!driveFiles.length) {
    setStatus(`No .xlsx files found in the "${dash.driveFolderName}" Drive folder.`, true);
    return;
  }
  // Keep only the lightweight reference fields the dashboard needs — never
  // the file content, which this page never downloads in the first place.
  const fileRefs = driveFiles.map((f) => ({ id: f.id, name: f.name, modifiedTime: f.modifiedTime }));
  try {
    await jazzPutSession(dash.id, { kind: "drive", label: dash.driveFolderName, fileRefs, savedAt: Date.now() });
  } catch (err) {
    setStatus("Couldn't hand the files over to the dashboard: " + err.message, true);
    return;
  }
  setStatus(`Opening in ${dash.label}…`);
  window.location.href = dash.url;
}

function renderUserChip() {
  const chip = document.getElementById("userChip");
  chip.innerHTML = `
    ${currentUser.picture ? `<img src="${currentUser.picture}" alt="">` : ""}
    <div class="who">
      <div class="name">${escapeHtml(currentUser.name || currentUser.email || "Signed in")}</div>
      <div class="email">${escapeHtml(currentUser.email || "")}</div>
    </div>
    <span class="signout" id="signOutBtn">Sign out</span>
  `;
  document.getElementById("signOutBtn").addEventListener("click", signOut);
}
function signOut() {
  if (accessToken && typeof google !== "undefined" && google.accounts && google.accounts.oauth2.revoke) {
    google.accounts.oauth2.revoke(accessToken, () => {});
  }
  try { sessionStorage.removeItem(JAZZDASH_TOKEN_KEY); } catch (e) {}
  accessToken = null;
  currentUser = null;
  setStatus("");
  showPanel(homePanel);
}
</script>
